services:
  jarvis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-assistant
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      # Connects to Ollama running on the host machine by default
      - JARVIS_LLM_BASE_URL=${JARVIS_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - JARVIS_LLM_API_KEY=${JARVIS_LLM_API_KEY:-not-needed}
      - JARVIS_FAST_MODEL=${JARVIS_FAST_MODEL:-qwen3:4b}
      - JARVIS_SMART_MODEL=${JARVIS_SMART_MODEL:-qwen3:4b}
      - JARVIS_DB_PATH=/app/data/jarvis.db
      - JARVIS_MAX_HISTORY_TURNS=${JARVIS_MAX_HISTORY_TURNS:-5}
      - JARVIS_MAX_PARALLEL_GENERATIONS=${JARVIS_MAX_PARALLEL_GENERATIONS:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
