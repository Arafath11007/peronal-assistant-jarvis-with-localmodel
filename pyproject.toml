[project]
name = "jarvis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yasar", email = "arafath1007@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "openai>=3.58.0",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
jarvis = "jarvis:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
