<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Claude-like warm serif & clean sans pairing + mono -->
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    /* Claude's signature warm neutral light palette */
    --bg-main: #fbfbf9;
    --bg-surface: #f3f3ee;
    --bg-card: #ecece6;
    --bg-input: #ffffff;
    --border-subtle: #e6e4dc;
    --border-focus: #c8c5b8;
    --text-primary: #1f1e1d;
    --text-secondary: #5c5a55;
    --text-muted: #8c8980;
    
    /* Claude terracotta / peach warm accent */
    --accent: #da7756;
    --accent-hover: #c86847;
    --accent-glow: rgba(218, 119, 86, 0.18);
    --accent-soft: #fcf4f0;
    
    --user-bubble: #f0efe9;
    --user-text: #1f1e1d;
    --assistant-text: #2c2a29;
    --code-bg: #1f2024;
    --code-header: #282a30;
    --danger: #cf4b38;
    
    --font-serif: 'Newsreader', Georgia, serif;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 20px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      /* Claude's signature warm dark chocolate/charcoal palette */
      --bg-main: #1e1e1e;
      --bg-surface: #181818;
      --bg-card: #272727;
      --bg-input: #232323;
      --border-subtle: #323232;
      --border-focus: #4a4a4a;
      --text-primary: #e5e3dd;
      --text-secondary: #a3a19b;
      --text-muted: #73716b;
      
      --accent: #d97757;
      --accent-hover: #e0886b;
      --accent-glow: rgba(217, 119, 87, 0.22);
      --accent-soft: #2a201c;
      
      --user-bubble: #2b2b29;
      --user-text: #edece8;
      --assistant-text: #e1dfd9;
      --code-bg: #141416;
      --code-header: #1c1d22;
      --danger: #e06c58;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    height: 100vh;
    display: flex;
    background: var(--bg-main);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.65;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* --- Claude Sidebar --- */
  aside {
    width: 270px;
    background: var(--bg-surface);
    border-right: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    height: 100%;
    flex-shrink: 0;
    transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 25;
  }

  .sidebar-header {
    padding: 16px 16px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-serif);
    font-size: 21px;
    font-weight: 500;
    letter-spacing: -0.3px;
    color: var(--text-primary);
  }
  .brand-spark {
    color: var(--accent);
    font-size: 18px;
  }

  .btn-new {
    margin: 4px 14px 12px;
    padding: 8px 12px;
    background: transparent;
    color: var(--text-primary);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    cursor: pointer;
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 13.5px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
    transition: background 0.12s, border-color 0.12s;
  }
  .btn-new:hover {
    background: var(--bg-card);
    border-color: var(--border-focus);
  }

  .search-container {
    margin: 0 14px 10px;
    position: relative;
  }
  .search-container input {
    width: 100%;
    padding: 7px 10px 7px 30px;
    background: transparent;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-container input:focus {
    border-color: var(--border-focus);
    background: var(--bg-main);
  }
  .search-container svg {
    position: absolute;
    left: 9px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    stroke: var(--text-muted);
  }

  .session-group-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    padding: 10px 18px 4px;
  }

  #sessions {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  #sessions::-webkit-scrollbar { width: 4px; }
  #sessions::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }

  .session-item {
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    transition: background 0.12s;
  }
  .session-item:hover { background: var(--bg-card); }
  .session-item.active { background: var(--bg-card); }
  
  .session-title {
    font-size: 13px;
    font-weight: 450;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text-primary);
    flex: 1;
  }
  .session-actions {
    display: none;
    align-items: center;
    gap: 2px;
  }
  .session-item:hover .session-actions,
  .session-item.active .session-actions { display: flex; }
  
  .action-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 3px;
    border-radius: 4px;
    display: flex;
    align-items: center;
  }
  .action-btn:hover { color: var(--text-primary); }
  .action-btn.del:hover { color: var(--danger); }

  /* --- Main View --- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
    min-width: 0;
    background: var(--bg-main);
    position: relative;
  }

  .top-bar {
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    background: var(--bg-main);
    border-bottom: 1px solid var(--border-subtle);
  }
  .top-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .toggle-sidebar {
    display: none;
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 6px;
  }
  .model-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 450;
  }
  .status-indicator {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #10b981;
  }
  .top-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ghost-btn {
    background: none;
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    border-radius: var(--radius-sm);
    padding: 4px 10px;
    font-size: 12.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.12s, color 0.12s;
  }
  .ghost-btn:hover {
    background: var(--bg-card);
    color: var(--text-primary);
  }

  /* --- Chat Scroll Area --- */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 32px 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    scroll-behavior: smooth;
  }
  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 6px; }

  /* Claude Greeting Screen */
  .empty-state {
    max-width: 680px;
    margin: auto;
    text-align: center;
    padding: 40px 20px;
  }
  .empty-greeting {
    font-family: var(--font-serif);
    font-size: 34px;
    font-weight: 400;
    color: var(--text-primary);
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }
  .empty-subtext {
    font-size: 15px;
    color: var(--text-muted);
  }

  .msg-container {
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }

  /* User Message: Warm rounded pill aligned right */
  .msg-container.user {
    align-items: flex-end;
  }
  .msg-container.user .user-content {
    background: var(--user-bubble);
    color: var(--user-text);
    padding: 12px 18px;
    border-radius: var(--radius-lg);
    font-size: 15px;
    line-height: 1.55;
    max-width: 82%;
    word-break: break-word;
    white-space: pre-wrap;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }

  /* Assistant Message: Clean editorial typography aligned left */
  .msg-container.assistant {
    align-items: flex-start;
  }
  .assistant-wrapper {
    display: flex;
    gap: 16px;
    width: 100%;
  }
  .assistant-avatar {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-serif);
    font-size: 16px;
    font-weight: 500;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .assistant-body {
    flex: 1;
    min-width: 0;
    color: var(--assistant-text);
    font-size: 15.5px;
    line-height: 1.7;
    word-break: break-word;
  }

  /* Claude Prose & Markdown */
  .assistant-body p { margin-bottom: 14px; }
  .assistant-body p:last-child { margin-bottom: 0; }
  .assistant-body h1, .assistant-body h2, .assistant-body h3 {
    font-family: var(--font-serif);
    font-weight: 500;
    color: var(--text-primary);
    margin: 20px 0 10px;
    line-height: 1.35;
  }
  .assistant-body h1 { font-size: 1.4em; }
  .assistant-body h2 { font-size: 1.25em; }
  .assistant-body h3 { font-size: 1.1em; }
  .assistant-body ul, .assistant-body ol {
    margin: 10px 0 14px 22px;
  }
  .assistant-body li {
    margin-bottom: 6px;
    padding-left: 4px;
  }
  .assistant-body code:not(pre code) {
    font-family: var(--font-mono);
    font-size: 13.5px;
    padding: 2px 5px;
    background: var(--bg-card);
    border-radius: 4px;
    color: var(--accent);
  }

  /* Code Block (Claude Style dark card with header) */
  .code-card {
    margin: 20px 0;
    border-radius: var(--radius-md);
    overflow: hidden;
    background: var(--code-bg);
    border: 1px solid var(--border-subtle);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
  }
  .code-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    background: var(--code-header);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.3px;
    color: #abb2bf;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }
  .copy-code-btn {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #abb2bf;
    cursor: pointer;
    font-family: var(--font-sans);
    font-size: 11.5px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 8px;
    border-radius: var(--radius-sm);
    transition: all 0.15s ease;
  }
  .copy-code-btn:hover {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.25);
  }
  .code-card pre {
    margin: 0;
    padding: 16px 20px;
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 13.5px;
    line-height: 1.65;
    color: #e5e7eb;
  }
  .code-card pre code {
    font-family: inherit;
    font-size: inherit;
    background: transparent !important;
    padding: 0 !important;
    border-radius: 0 !important;
    color: inherit !important;
  }

  /* --- Claude-Style Responsive Elegant Tables --- */
  .table-wrapper {
    width: 100%;
    margin: 20px 0;
    overflow-x: auto;
    overflow-y: hidden;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-subtle);
    background: var(--bg-surface);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    scrollbar-width: thin;
    scrollbar-color: var(--accent) var(--bg-card);
  }
  .table-wrapper::-webkit-scrollbar {
    height: 8px;
  }
  .table-wrapper::-webkit-scrollbar-track {
    background: var(--bg-card);
    border-radius: 0 0 var(--radius-md) var(--radius-md);
  }
  .table-wrapper::-webkit-scrollbar-thumb {
    background: var(--accent);
    border-radius: 4px;
    border: 2px solid var(--bg-card);
  }
  .table-wrapper::-webkit-scrollbar-thumb:hover {
    background: var(--accent-hover);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    line-height: 1.5;
    text-align: left;
    min-width: 480px;
  }
  thead {
    background: var(--bg-card);
    border-bottom: 2px solid var(--border-subtle);
  }
  th {
    padding: 12px 18px;
    font-weight: 600;
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
    white-space: nowrap;
  }
  tbody tr {
    border-bottom: 1px solid var(--border-subtle);
    transition: background 0.12s ease;
  }
  tbody tr:last-child {
    border-bottom: none;
  }
  tbody tr:hover {
    background: rgba(218, 119, 86, 0.04);
  }
  td {
    padding: 12px 18px;
    color: var(--text-primary);
    vertical-align: top;
  }
  td code {
    font-size: 12.5px;
  }

  /* Action buttons under assistant message */
  .assistant-footer {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .foot-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    padding: 3px 6px;
    border-radius: 4px;
    transition: color 0.12s, background 0.12s;
  }
  .foot-btn:hover {
    color: var(--text-primary);
    background: var(--bg-card);
  }

  /* --- Claude Input Box (Floating Rounded Card) --- */
  .input-outer-wrapper {
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 0 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #status {
    min-height: 16px;
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
    padding-left: 4px;
  }
  .spinner-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1s infinite alternate;
  }
  @keyframes pulse { from { opacity: 0.3; } to { opacity: 1; } }

  .claude-input-card {
    background: var(--bg-input);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  .claude-input-card:focus-within {
    border-color: var(--border-focus);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
  }

  textarea {
    width: 100%;
    resize: none;
    background: transparent;
    border: none;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
    outline: none;
    max-height: 200px;
  }
  textarea::placeholder { color: var(--text-muted); }

  .card-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 4px;
  }
  .toolbar-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .claude-pill-select {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    padding: 4px 8px;
    border-radius: 14px;
    font-size: 12px;
    font-family: inherit;
    outline: none;
    cursor: pointer;
  }
  .mic-icon-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 5px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s, background 0.15s;
  }
  .mic-icon-btn:hover { color: var(--text-primary); background: var(--bg-card); }
  .mic-icon-btn.recording { color: var(--danger); }

  .claude-send-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .claude-send-btn:hover { background: var(--accent-hover); transform: scale(1.04); }
  .claude-send-btn.stop { background: var(--danger); }

  @media (max-width: 768px) {
    aside {
      position: absolute;
      top: 0; bottom: 0; left: 0;
      transform: translateX(-100%);
    }
    aside.open { transform: translateX(0); }
    .toggle-sidebar { display: block; }
  }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="sidebar-header">
    <div class="brand">
      <span class="brand-spark">✦</span>
      <span>Jarvis</span>
    </div>
  </div>
  <button class="btn-new" id="new">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
    Start new chat
  </button>
  <div class="search-container">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input type="text" id="search" placeholder="Search conversations...">
  </div>
  <div class="session-group-title">Recent Chats</div>
  <div id="sessions"></div>
</aside>

<main>
  <div class="top-bar">
    <div class="top-left">
      <button class="toggle-sidebar" id="toggle-sidebar" title="Toggle Sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="model-badge">
        <span class="status-indicator"></span>
        <span id="active-model-name">Jarvis</span>
      </div>
    </div>
    <div class="top-actions">
      <button class="ghost-btn" id="btn-export" title="Export to Markdown">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
        </svg>
        <span>Export</span>
      </button>
    </div>
  </div>

  <div id="log">
    <div class="empty-state" id="empty-state">
      <h1 class="empty-greeting">Good day. How can I assist you?</h1>
      <p class="empty-subtext">Jarvis is ready to help brainstorm, write code, or reason through problems.</p>
    </div>
  </div>

  <div class="input-outer-wrapper">
    <div id="status"></div>
    <form class="claude-input-card" id="form">
      <textarea id="input" rows="2" autofocus placeholder="Reply to Jarvis…"></textarea>
      <div class="card-toolbar">
        <div class="toolbar-left">
          <select id="tier" class="claude-pill-select" title="Model Tier">
            <option value="fast">Fast</option>
            <option value="smart">Smart</option>
          </select>
          <select id="channel" class="claude-pill-select" title="Channel">
            <option value="text">Text</option>
            <option value="voice">Voice</option>
          </select>
          <button type="button" class="mic-icon-btn" id="mic-btn" title="Dictate prompt">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
              <path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/>
            </svg>
          </button>
        </div>
        <button class="claude-send-btn" id="send" type="button" title="Send message">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>
    </form>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const log = $("log"), statusEl = $("status"), input = $("input");
const sendBtn = $("send"), tierSel = $("tier"), channelSel = $("channel"), form = $("form");
const sidebar = $("sidebar"), toggleSidebar = $("toggle-sidebar"), searchInput = $("search");
const micBtn = $("mic-btn"), exportBtn = $("btn-export"), emptyState = $("empty-state");

let sessionId = null, controller = null, busy = false, timer = null;
let allSessions = [];
let userScrolledUp = false;

// Track user scroll position: if the user scrolls away from the bottom, pause auto-scroll
log.addEventListener("scroll", () => {
  const threshold = 60; // px tolerance from bottom
  const distanceFromBottom = log.scrollHeight - log.scrollTop - log.clientHeight;
  userScrolledUp = distanceFromBottom > threshold;
});

function scrollToBottomIfNeeded(force = false) {
  if (force || !userScrolledUp) {
    log.scrollTop = log.scrollHeight;
  }
}

// Configure Marked with Highlight.js
marked.setOptions({
  highlight: function(code, lang) {
    if (lang && hljs.getLanguage(lang)) {
      return hljs.highlight(code, { language: lang }).value;
    }
    return hljs.highlightAuto(code).value;
  },
  breaks: true
});

// Custom code block renderer with language banner and copy button
const renderer = {
  code({ text, lang }) {
    const language = lang || 'plaintext';
    return `
      <div class="code-card">
        <div class="code-card-header">
          <span>${language}</span>
          <button class="copy-code-btn" onclick="copyCode(this)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path>
            </svg>
            Copy
          </button>
        </div>
        <pre><code>${hljs.highlightAuto(text).value}</code></pre>
      </div>
    `;
  }
};

marked.use({ renderer });

// Custom post-processor to ensure tables are wrapped in responsive containers
const originalParse = marked.parse;
marked.parse = function(src, options) {
  let html = originalParse(src, options);
  // Wrap any <table> that isn't already inside .table-wrapper
  html = html.replace(/(<table[\s\S]*?<\/table>)/gi, (match) => {
    return `<div class="table-wrapper">${match}</div>`;
  });
  return html;
};

function copyCode(btn) {
  const code = btn.closest('.code-card').querySelector('code').innerText;
  navigator.clipboard.writeText(code).then(() => {
    btn.innerHTML = `✓ Copied`;
    setTimeout(() => {
      btn.innerHTML = `
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path>
        </svg> Copy`;
    }, 2000);
  });
}

function speakText(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 1.0;
  window.speechSynthesis.speak(utterance);
}

function hideEmptyState() {
  if (emptyState) emptyState.style.display = "none";
}

function createMessageElements(role) {
  hideEmptyState();
  const container = document.createElement("div");
  container.className = `msg-container ${role}`;

  if (role === "user") {
    const bubble = document.createElement("div");
    bubble.className = "user-content";
    container.appendChild(bubble);
    log.appendChild(container);
    return { container, contentEl: bubble };
  } else {
    const wrapper = document.createElement("div");
    wrapper.className = "assistant-wrapper";

    const avatar = document.createElement("div");
    avatar.className = "assistant-avatar";
    avatar.textContent = "J";

    const body = document.createElement("div");
    body.className = "assistant-body";

    wrapper.append(avatar, body);
    container.appendChild(wrapper);
    log.appendChild(container);
    return { container, contentEl: body };
  }
}

function addMsg(role, text = "") {
  const { container, contentEl } = createMessageElements(role);
  if (role === "user") {
    contentEl.textContent = text;
  } else {
    contentEl.innerHTML = marked.parse(text);
    addAssistantFooter(container, text);
  }
  scrollToBottomIfNeeded(true);
  return contentEl;
}

function addAssistantFooter(container, text, metaText = "") {
  const footer = document.createElement("div");
  footer.className = "assistant-footer";

  if (metaText) {
    const meta = document.createElement("span");
    meta.textContent = metaText;
    footer.appendChild(meta);
  }

  const copyBtn = document.createElement("button");
  copyBtn.className = "foot-btn";
  copyBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg> Copy`;
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(text);
    copyBtn.innerText = "Copied!";
    setTimeout(() => {
      copyBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg> Copy`;
    }, 1500);
  };

  const speakBtn = document.createElement("button");
  speakBtn.className = "foot-btn";
  speakBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg> Read aloud`;
  speakBtn.onclick = () => speakText(text);

  footer.append(copyBtn, speakBtn);
  container.querySelector('.assistant-body').appendChild(footer);
}

function startTimer(label) {
  const t0 = performance.now();
  clearInterval(timer);
  statusEl.innerHTML = `<span class="spinner-dot"></span> <span>${label}…</span>`;
  timer = setInterval(() => {
    const s = Math.floor((performance.now() - t0) / 1000);
    statusEl.innerHTML = `<span class="spinner-dot"></span> <span>${label}… ${s}s</span>`;
  }, 200);
}

function stopTimer() {
  clearInterval(timer);
  statusEl.innerHTML = "";
}

function setBusy(on) {
  busy = on;
  sendBtn.classList.toggle("stop", on);
  sendBtn.innerHTML = on ? `
    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
      <rect x="6" y="6" width="12" height="12" rx="2"></rect>
    </svg>` : `
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <line x1="12" y1="19" x2="12" y2="5"></line>
      <polyline points="5 12 12 5 19 12"></polyline>
    </svg>`;
}

function parseEvent(raw) {
  let event = "message", data = "";
  for (const line of raw.split("\n")) {
    if (line.startsWith("event: ")) event = line.slice(7);
    else if (line.startsWith("data: ")) data += line.slice(6);
  }
  return { event, data: data ? JSON.parse(data) : {} };
}

async function send(text) {
  userScrolledUp = false;
  addMsg("user", text);
  const { container, contentEl } = createMessageElements("assistant");
  let reply = "", raf = 0;

  const paint = () => {
    raf = 0;
    contentEl.innerHTML = marked.parse(reply);
    scrollToBottomIfNeeded();
  };
  const flush = () => { if (raf) cancelAnimationFrame(raf); paint(); };

  controller = new AbortController();
  setBusy(true);
  startTimer("Thinking");

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        message: text,
        session_id: sessionId,
        channel: channelSel.value,
        tier: tierSel.value
      }),
      signal: controller.signal,
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";

    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) !== -1) {
        const { event, data } = parseEvent(buf.slice(0, i));
        buf = buf.slice(i + 2);

        if (event === "status") {
          sessionId = data.session_id;
          startTimer(data.state === "queued" ? "Queued" : "Jarvis is responding");
        } else if (event === "tool_call") {
          startTimer(`Executing tool: ${data.name}`);
        } else if (event === "tool_result") {
          // Insert a subtle tool badge into the assistant container
          const badge = document.createElement("div");
          badge.className = "tool-badge";
          badge.innerHTML = `<span>⚡ Tool <b>${data.name}</b> returned</span>`;
          contentEl.appendChild(badge);
          scrollToBottomIfNeeded();
        } else if (event === "token") {
          if (!reply) stopTimer();
          reply += data.text;
          if (!raf) raf = requestAnimationFrame(paint);
        } else if (event === "done") {
          flush();
          const tps = data.tokens && data.total_s ? (data.tokens / data.total_s).toFixed(1) : "?";
          const first = data.first_token_s != null ? data.first_token_s.toFixed(2) : "n/a";
          const metaInfo = `${data.tokens} tokens · ${tps} tok/s (TTFT ${first}s)` +
                           (data.trimmed ? ` · trimmed ${data.trimmed} msgs` : "");
          addAssistantFooter(container, reply, metaInfo);

          if (channelSel.value === "voice") {
            speakText(reply);
          }
        } else if (event === "error") {
          throw new Error(data.message);
        }
      }
    }
  } catch (e) {
    if (e.name === "AbortError") {
      flush();
      const meta = document.createElement("div");
      meta.className = "assistant-footer";
      meta.textContent = "Halted by user.";
      contentEl.appendChild(meta);
    } else {
      contentEl.innerHTML = `<span style="color:var(--danger)">Error: ${e.message}</span>`;
    }
  } finally {
    stopTimer();
    setBusy(false);
    input.focus();
    loadSessions();
  }
}

async function loadSessions() {
  try {
    const res = await fetch("/sessions");
    allSessions = await res.json();
    renderSessionList(allSessions);
  } catch (err) {
    console.error("Failed to load sessions:", err);
  }
}

function renderSessionList(sessions) {
  const listEl = $("sessions");
  listEl.replaceChildren(...sessions.map(s => {
    const item = document.createElement("div");
    item.className = "session-item" + (s.id === sessionId ? " active" : "");

    const title = document.createElement("div");
    title.className = "session-title";
    title.textContent = s.title;

    const actions = document.createElement("div");
    actions.className = "session-actions";

    const editBtn = document.createElement("button");
    editBtn.className = "action-btn";
    editBtn.title = "Rename";
    editBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>`;
    editBtn.onclick = (e) => {
      e.stopPropagation();
      renameSession(s.id, s.title);
    };

    const delBtn = document.createElement("button");
    delBtn.className = "action-btn del";
    delBtn.title = "Delete";
    delBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path></svg>`;
    delBtn.onclick = (e) => {
      e.stopPropagation();
      deleteSession(s.id);
    };

    actions.append(editBtn, delBtn);
    item.append(title, actions);
    item.onclick = () => openSession(s.id);
    return item;
  }));
}

async function renameSession(id, currentTitle) {
  const newTitle = prompt("New conversation title:", currentTitle);
  if (!newTitle || newTitle.trim() === currentTitle) return;
  await fetch(`/sessions/${id}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title: newTitle.trim() })
  });
  loadSessions();
}

async function deleteSession(id) {
  if (!confirm("Delete this conversation?")) return;
  await fetch(`/sessions/${id}`, { method: "DELETE" });
  if (sessionId === id) {
    sessionId = null;
    log.replaceChildren();
    if (emptyState) log.appendChild(emptyState);
  }
  loadSessions();
}

async function openSession(id) {
  if (busy) return;
  const msgs = await (await fetch(`/sessions/${id}/messages`)).json();
  sessionId = id;
  log.replaceChildren();
  hideEmptyState();
  msgs.forEach(m => addMsg(m.role, m.content));
  loadSessions();
}

searchInput.addEventListener("input", (e) => {
  const q = e.target.value.toLowerCase();
  const filtered = allSessions.filter(s => s.title.toLowerCase().includes(q));
  renderSessionList(filtered);
});

$("new").onclick = () => {
  if (busy) return;
  sessionId = null;
  log.replaceChildren();
  if (emptyState) {
    emptyState.style.display = "block";
    log.appendChild(emptyState);
  }
  loadSessions();
  input.focus();
};

toggleSidebar.onclick = () => sidebar.classList.toggle("open");

// Export to Markdown
exportBtn.onclick = () => {
  const messages = log.querySelectorAll('.msg-container');
  if (!messages.length) return alert("No messages to export.");

  let md = `# Jarvis Conversation\nDate: ${new Date().toLocaleString()}\n\n---\n\n`;
  messages.forEach(msg => {
    const isUser = msg.classList.contains('user');
    const role = isUser ? "User" : "Jarvis";
    const text = isUser ? msg.querySelector('.user-content').innerText : msg.querySelector('.assistant-body').innerText;
    md += `### ${role}\n\n${text}\n\n---\n\n`;
  });

  const blob = new Blob([md], { type: "text/markdown" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `jarvis-${sessionId || "chat"}.md`;
  a.click();
};

// Web Speech API STT
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => micBtn.classList.add("recording");
  recognition.onend = () => micBtn.classList.remove("recording");
  recognition.onerror = () => micBtn.classList.remove("recording");
  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    input.value = (input.value ? input.value + " " : "") + transcript;
    input.focus();
  };

  micBtn.onclick = () => {
    if (micBtn.classList.contains("recording")) {
      recognition.stop();
    } else {
      recognition.start();
    }
  };
} else {
  micBtn.style.display = "none";
}

sendBtn.addEventListener("click", () => (busy ? controller.abort() : form.requestSubmit()));
form.addEventListener("submit", e => {
  e.preventDefault();
  if (busy) return;
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  send(text);
});

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

// Load health & models
fetch("/health").then(r => r.json()).then(data => {
  if (data.fast_model) {
    $("active-model-name").textContent = data.fast_model;
  }
}).catch(() => {});

loadSessions();
</script>
</body>
</html>
