<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<style>
  :root { --bg:#fff; --panel:#f5f5f7; --text:#1c1c1e; --muted:#6b6b70; --accent:#2f6fed;
          --user:#e8f0ff; --border:#e2e2e6; --err:#c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16171a; --panel:#1e1f23; --text:#ececf0; --muted:#9a9aa2; --accent:#4f86f7;
            --user:#23304d; --border:#2c2d33; --err:#ef6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:grid; grid-template-columns:260px 1fr;
         background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; }
  aside { background:var(--panel); border-right:1px solid var(--border);
          display:flex; flex-direction:column; min-height:0; }
  aside h1 { font-size:16px; margin:16px; }
  #new { margin:0 12px 12px; padding:8px; border:1px solid var(--border); border-radius:8px;
         background:var(--bg); color:var(--text); cursor:pointer; font:inherit; }
  #sessions { overflow-y:auto; flex:1; padding:0 8px 8px; }
  .s { padding:8px; border-radius:8px; cursor:pointer; }
  .s:hover, .s.active { background:var(--bg); }
  .s .t { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .s .m { font-size:12px; color:var(--muted); }
  main { display:flex; flex-direction:column; min-height:0; }
  #log { flex:1; overflow-y:auto; padding:24px; }
  .msg { max-width:760px; margin:0 auto 16px; padding:10px 14px; border-radius:12px; overflow-wrap:anywhere; }
  .msg.user { background:var(--user); white-space:pre-wrap; }
  .msg.err { color:var(--err); }
  .msg pre { background:var(--panel); padding:10px; border-radius:8px; overflow-x:auto; }
  .msg code { font-family:ui-monospace, monospace; font-size:13px; }
  .meta { font-size:12px; color:var(--muted); margin-top:6px; }
  #status { max-width:760px; width:100%; margin:0 auto; height:22px; padding:0 14px;
            font-size:13px; color:var(--muted); }
  form { max-width:760px; width:100%; margin:0 auto; padding:4px 14px 20px; display:flex; gap:8px; }
  textarea { flex:1; resize:none; padding:10px; border-radius:10px; border:1px solid var(--border);
             background:var(--panel); color:var(--text); font:inherit; }
  select, #send { padding:0 14px; border-radius:10px; border:1px solid var(--border);
                  background:var(--panel); color:var(--text); font:inherit; cursor:pointer; }
  #send { background:var(--accent); border-color:var(--accent); color:#fff; }
</style>
</head>
<body>
<aside>
  <h1>Jarvis</h1>
  <button id="new">+ New chat</button>
  <div id="sessions"></div>
</aside>
<main>
  <div id="log"></div>
  <div id="status"></div>
  <form id="form">
    <textarea id="input" rows="2" autofocus
      placeholder="Message Jarvis…  (Enter to send, Shift+Enter for a new line)"></textarea>
    <select id="tier" title="Model tier">
      <option value="fast">fast</option>
      <option value="smart">smart</option>
    </select>
    <button id="send" type="button">Send</button>
  </form>
</main>

<script>
const $ = id => document.getElementById(id);
const log = $("log"), statusEl = $("status"), input = $("input");
const sendBtn = $("send"), tierSel = $("tier"), form = $("form");
let sessionId = null, controller = null, busy = false, timer = null;

// --- tiny, XSS-safe markdown: escape everything first, then add our own tags ---
const FENCE = "`".repeat(3);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function md(src) {
  return src.split(FENCE).map((part, i) => {
    if (i % 2 === 1) {                                   // inside a code fence
      return `<pre><code>${esc(part.replace(/^[^\n]*\n/, ""))}</code></pre>`;
    }
    return esc(part)
      .replace(/`([^`\n]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\n/g, "<br>");
  }).join("");
}

function addMsg(role, text = "") {
  const el = document.createElement("div");
  el.className = "msg " + role;
  if (role === "user") el.textContent = text; else el.innerHTML = md(text);
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}
function addMeta(el, text) {
  const m = document.createElement("div");
  m.className = "meta";
  m.textContent = text;
  el.appendChild(m);
}

function startTimer(label) {
  const t0 = performance.now();
  clearInterval(timer);
  statusEl.textContent = `${label}…`;
  timer = setInterval(() => {
    statusEl.textContent = `${label}… ${Math.floor((performance.now() - t0) / 1000)}s`;
  }, 200);
}
function stopTimer() { clearInterval(timer); statusEl.textContent = ""; }

function setBusy(on) { busy = on; sendBtn.textContent = on ? "Stop" : "Send"; }

function parseEvent(raw) {
  let event = "message", data = "";
  for (const line of raw.split("\n")) {
    if (line.startsWith("event: ")) event = line.slice(7);
    else if (line.startsWith("data: ")) data += line.slice(6);
  }
  return { event, data: JSON.parse(data) };
}

async function send(text) {
  addMsg("user", text);
  const bubble = addMsg("assistant");
  let reply = "", raf = 0;
  const paint = () => { raf = 0; bubble.innerHTML = md(reply); log.scrollTop = log.scrollHeight; };
  const flush = () => { if (raf) cancelAnimationFrame(raf); paint(); };

  controller = new AbortController();
  setBusy(true);
  startTimer("Sending");
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ message: text, session_id: sessionId, channel: "text", tier: tierSel.value }),
      signal: controller.signal,
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) !== -1) {
        const { event, data } = parseEvent(buf.slice(0, i));
        buf = buf.slice(i + 2);
        if (event === "status") {
          sessionId = data.session_id;
          startTimer(data.state === "queued" ? "Queued behind another reply" : "Jarvis is thinking");
        } else if (event === "token") {
          if (!reply) stopTimer();
          reply += data.text;
          if (!raf) raf = requestAnimationFrame(paint);
        } else if (event === "done") {
          flush();
          const tps = data.tokens && data.total_s ? (data.tokens / data.total_s).toFixed(1) : "?";
          const first = data.first_token_s != null ? data.first_token_s.toFixed(1) : "n/a";
          addMeta(bubble, `first token ${first}s · ${data.tokens} tokens · ${tps} tok/s` +
                          (data.trimmed ? ` · trimmed ${data.trimmed} old msgs` : ""));
        } else if (event === "error") {
          throw new Error(data.message);
        }
      }
    }
  } catch (e) {
    if (e.name === "AbortError") {
      flush();
      addMeta(bubble, "stopped (this reply was not saved)");
    } else {
      bubble.classList.add("err");
      bubble.textContent = `Error: ${e.message}`;
    }
  } finally {
    stopTimer();
    setBusy(false);
    input.focus();
    loadSessions();
  }
}

async function loadSessions() {
  const rows = await (await fetch("/sessions")).json();
  $("sessions").replaceChildren(...rows.map(s => {
    const el = document.createElement("div");
    el.className = "s" + (s.id === sessionId ? " active" : "");
    const t = document.createElement("div");
    t.className = "t"; t.textContent = s.title;
    const m = document.createElement("div");
    m.className = "m";
    // SQLite stores UTC; show it in the browser's local time
    const when = new Date(s.updated_at.replace(" ", "T") + "Z")
      .toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
    m.textContent = `${when} · ${Math.floor(s.n / 2)} turns`;
    el.append(t, m);
    el.onclick = () => openSession(s.id);
    return el;
  }));
}

async function openSession(id) {
  if (busy) return;
  const msgs = await (await fetch(`/sessions/${id}/messages`)).json();
  sessionId = id;
  log.replaceChildren();
  msgs.forEach(m => addMsg(m.role, m.content));
  loadSessions();
}

$("new").onclick = () => {
  if (busy) return;
  sessionId = null;
  log.replaceChildren();
  loadSessions();
  input.focus();
};

sendBtn.addEventListener("click", () => (busy ? controller.abort() : form.requestSubmit()));
form.addEventListener("submit", e => {
  e.preventDefault();
  if (busy) return;
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  send(text);
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

loadSessions();
</script>
</body>
</html>
